name: Build Vite app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run fmt:check
      # `vite build` does not type-check, so this is the only gate on types.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # A job of its own so it runs beside the checks above instead of after them:
  # installing a browser is the slow part, and nothing here depends on the build.
  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Chromium only: the suite asserts DOM/focus behaviour, not cross-engine
      # rendering, so a second browser would double the runtime for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # `playwright.config.ts` starts the Vite dev server itself (React only
      # double-invokes StrictMode effects in a development build).
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
